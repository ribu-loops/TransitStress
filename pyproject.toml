[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "transitstress"
version = "0.1.0"
authors = [{ name = "ribu-loops", email = "344381376+ribu-loops@users.noreply.github.com" }]
description = "Paired transit injection and preprocessing robustness experiment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "astropy", "lightkurve", "plotly", "streamlit"]

[project.scripts]
transitstress = "transitstress.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "bandit", "pip-audit"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


# Explicit public source selection; preserve ignored tools/private state locally.
[tool.hatch.build.targets.sdist]
include = [
  "/src/**/*.py", "/app.py", "/.streamlit/config.toml",
  "/configs/*.toml", "/configs/*.json", "/data/*.json", "/data/*.csv",
  "/demo/**", "/tests/**/*.py", "/tests/fixtures/**",
  "/docs/ATTRIBUTION.md", "/docs/METHODS_RESULTS.md", "/docs/SCIENCE.md",
  "/docs/SOURCES.md", "/docs/SECURITY_SOURCES.md", "/docs/ENGINEERING.md",
  "/docs/ENVIRONMENT.md", "/docs/RUNNING.md", "/docs/DISTRIBUTION.md",
  "/docs/DEMO_WALKTHROUGH.md", "/docs/T09_WORKBENCH.md", "/docs/T10_DEMO.md",
  "/docs/T11_CI.md", "/docs/T11_CLOSEOUT.md", "/docs/PROTOCOL*.md", "/docs/PROTOCOL*.json",
  "/docs/T11_REPRODUCTION*_OUTCOME.md", "/docs/corrections/**", "/docs/reviews/**",
  "/docs/review_pack/**", "/docs/visual/T10/**",
  "/reports/t07_evaluation/**", "/reports/T07_PRELIMINARY.md",
  "/reports/t07_evaluation_evidence.json", "/reports/t04_sanity/**",
  "/reports/t06_development/**", "/reports/t06_development_evidence.json",
  "/reports/T11_REPRODUCTION_V5_ATTEMPT.json",
  "/scripts/*.py", "/scripts/*.json", "/devtools/*.py", "/examples/*",
  "/.github/workflows/offline.yml", "/README.md", "/CONTRIBUTIONS.md",
  "/AGENTS.md", "/SECURITY.md", "/DESIGN.md", "/PLAN.md", "/LICENSE", "/NOTICE",
  "/.python-version", "/.gitignore", "/.gitattributes", "/pyproject.toml", "/uv.lock",
]
exclude = [
  "**/__pycache__/**", "**/*.pyc", "/.cache/**", "/.tools/**", "/.venv/**",
  "/runs/**", "/private_notes/**", "/data/raw/**", "/local_uploads/**",
  "/.env*", "/.streamlit/secrets.toml", "/security_reports/**",
  "/NEXT_SESSION_PROMPT.md", "/STATE.md", "/WORKLOG.md",
  "/docs/LEARNING.md", "/docs/T07_SESSION_PROMPT.md",
  "**/.git/**", "**/.vscode/**", "**/.idea/**", "**/*.pem", "**/*.key",
]
