[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "transitstress"
version = "0.1.0"
authors = [{ name = "ribu-loops", email = "344381376+ribu-loops@users.noreply.github.com" }]
description = "Paired transit injection and preprocessing robustness experiment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
# Security floors are ordinary Requires-Dist entries, including transitive protections.
# Keep the reviewed Streamlit/Pillow compatibility line; other direct requirements unchanged.
dependencies = [
  "numpy", "pandas", "astropy", "lightkurve", "plotly",
  "streamlit>=1.66.1,<1.67", "pillow>=13.0.0,<14", "certifi>=2026.10.19",
]

[project.scripts]
transitstress = "transitstress.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "bandit", "pip-audit"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


# Explicit public source selection; preserve ignored tools/private state locally.
[tool.hatch.build.targets.sdist]
include = [
  "/src/**/*.py", "/app.py", "/.streamlit/config.toml",
  "/configs/*.toml", "/configs/*.json", "/data/*.json", "/data/*.csv",
  "/demo/**", "/tests/**/*.py", "/tests/fixtures/**",
  "/docs/public/**", "/docs/ATTRIBUTION.md", "/docs/SOURCES.md", "/docs/SECURITY_SOURCES.md",
  "/reports/t04_sanity/**",
  "/scripts/*.py", "/scripts/*.json", "/devtools/install_gitleaks.py", "/examples/*",
  "/.github/workflows/offline.yml", "/README.md", "/CONTRIBUTIONS.md",
  "/SECURITY.md", "/LICENSE", "/NOTICE", "/.python-version", "/.gitignore",
  "/.gitattributes", "/pyproject.toml", "/uv.lock",
]
exclude = [
  "/demo/t10/T07.md", "/demo/t10/bundle.json",
  "**/__pycache__/**", "**/*.pyc", "/.cache/**", "/.tools/**", "/.venv/**",
  "/runs/**", "/private_notes/**", "/data/raw/**", "/local_uploads/**",
  "/.env*", "/.streamlit/secrets.toml", "/security_reports/**",
  "/NEXT_SESSION_PROMPT.md", "/STATE.md", "/WORKLOG.md",
  "/docs/LEARNING.md", "/docs/T07_SESSION_PROMPT.md",
  "**/.git/**", "**/.vscode/**", "**/.idea/**", "**/*.pem", "**/*.key",
]

# Labelled public review derivative and its transport manifest; originals stay in Git.
[tool.hatch.build.targets.sdist.force-include]
"docs/public/demo/T07.md" = "demo/t10/T07.md"
"docs/public/demo/bundle.json" = "demo/t10/bundle.json"

# T12 minimum advisory remediation; retain the resolved numerical stack.
[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19", "pillow>=13.0.0"]
