[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#8A6500"
linkColor = "#F4CE68"
backgroundColor = "#111827"
secondaryBackgroundColor = "#1B2638"
textColor = "#F1F5F9"
font = "sans-serif"
