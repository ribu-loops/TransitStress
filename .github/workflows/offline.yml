name: Offline release checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TRANSITSTRESS_MODE: demo
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PYTHON: "3.12.15"
      UV_MANAGED_PYTHON: "1"
      UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/transitstress-python
    steps:
      - name: Checkout (v5.1.0; Node24)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install uv (action v10.3.2; Node24; verified tool archive)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
          cache-python: false
          activate-environment: false
          checksum: ${{ runner.os == 'Windows' && 'a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a' || 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f' }}
      - name: Install locked dependencies (setup network only)
        run: uv sync --locked --python 3.12.15
      - name: Install pinned scanner (setup network only)
        run: uv run --locked --no-sync python devtools/install_gitleaks.py --download
      - name: Offline release verification (packaged fixtures; no benchmark download)
        env:
          UV_OFFLINE: "1"
        run: uv run --locked --no-sync python scripts/check.py --level release
