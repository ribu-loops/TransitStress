name: Offline release checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TRANSITSTRESS_MODE: demo
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PYTHON: "3.12.15"
    steps:
      - name: Checkout (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install uv (action v6.0.1; tool matches local lock environment)
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: "0.13.1"
          python-version: "3.12.15"
          enable-cache: false
      - name: Install locked dependencies (setup network only)
        run: uv sync --locked --python 3.12.15
      - name: Install pinned scanner (setup network only)
        run: uv run --locked --no-sync python devtools/install_gitleaks.py --download
      - name: Offline release verification (packaged fixtures; no benchmark download)
        env:
          UV_OFFLINE: "1"
        run: uv run --locked --no-sync python scripts/check.py --level release
